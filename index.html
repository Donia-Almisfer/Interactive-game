<!DOCTYPE html>
<html lang="ar" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>عنصر | تحدي الكيمياء</title>
<style>
:root {
  color-scheme: dark;
  --blue: #71a7ff;
  --text: #edf4ff;
  --muted: #a6b6d0;
  --border: rgba(159, 191, 255, .18);
  --surface: rgba(19, 34, 63, .88);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: 36px 22px;
  overflow-x: hidden;
  color: var(--text);
  font-family: Tahoma, Arial, sans-serif;
  background:
    radial-gradient(ellipse at 10% 15%, #224b874d, transparent 48%),
    radial-gradient(ellipse at 90% 80%, #174ba545, transparent 50%),
    linear-gradient(145deg, #080f20, #102340);
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    linear-gradient(#8bb4ff06 1px, transparent 1px),
    linear-gradient(90deg, #8bb4ff06 1px, transparent 1px);
  background-size: 48px 48px;
  mask-image: linear-gradient(black, transparent);
}

main {
  position: relative;
  z-index: 1;
  width: min(100%, 620px);
  text-align: center;
  animation: enter .6s ease both;
}

.brand {
  margin-bottom: 30px;
  color: var(--blue);
  font-size: 25px;
  font-weight: 800;
  letter-spacing: -.5px;
}

.tag {
  display: inline-flex;
  align-items: center;
  padding: 11px 19px;
  border: 1px solid #81adff30;
  border-radius: 100px;
  background: #6199ff12;
  color: #b9d3ff;
  font-size: 13px;
  line-height: 1.6;
}

h1 {
  margin: 22px 0 14px;
  font-size: clamp(34px, 7vw, 52px);
  line-height: 1.4;
  letter-spacing: -1.6px;
}

h1 span {
  color: var(--blue);
  overflow-wrap: anywhere;
}

@supports (background-clip: text) {
  h1 span {
    background: linear-gradient(120deg, #b7d9ff, #699cff, #93b9ff);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
  }
}

p {
  color: var(--muted);
  line-height: 1.9;
  font-size: 15px;
}

.card {
  position: relative;
  margin-top: 25px;
  padding: 32px;
  border: 1px solid var(--border);
  border-radius: 28px;
  background:
    linear-gradient(145deg, #ffffff06, transparent 65%),
    var(--surface);
  box-shadow:
    0 25px 80px #00000035,
    inset 0 1px 0 #ffffff08;
}

@supports (backdrop-filter: blur(20px)) {
  .card {
    background:
      linear-gradient(145deg, #ffffff08, transparent 65%),
      rgba(20, 37, 67, .68);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
}

label {
  display: block;
  text-align: right;
  color: #dbe8ff;
  font-size: 15px;
  font-weight: 700;
  line-height: 1.7;
}

input,
button {
  font: inherit;
  border-radius: 15px;
}

input {
  width: 100%;
  margin: 15px 0 19px;
  padding: 18px;
  border: 1px solid #91b5f52b;
  background: #08172c80;
  color: var(--text);
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}

input::placeholder {
  color: #8193ae;
}

input:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 4px #71a7ff18;
}

button {
  min-height: 54px;
  padding: 16px 22px;
  border: 1px solid #91bbff40;
  background: linear-gradient(135deg, #4387ff, #255de2);
  box-shadow: 0 8px 25px #1c58da30;
  color: white;
  font-weight: 700;
  line-height: 1.6;
  cursor: pointer;
  transition:
    transform .2s,
    border-color .2s,
    background .2s,
    box-shadow .2s;
}

.wide {
  width: 100%;
}

button:focus-visible {
  outline: 3px solid #b7d5ff;
  outline-offset: 4px;
}

button:disabled {
  opacity: .4;
  cursor: default;
  box-shadow: none;
}

button:active:not(:disabled) {
  transform: translateY(1px);
}

.meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  margin-bottom: 19px;
  color: #b1c3df;
  font-size: 14px;
}

.timer {
  min-width: 85px;
  padding: 12px 16px;
  border: 1px solid #80acff30;
  border-radius: 14px;
  background: #5d94ff14;
  color: #b5d3ff;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  direction: ltr;
}

.timer.urgent {
  border-color: #ff998e55;
  background: #ff71661a;
  color: #ffb4a9;
}

.bar {
  height: 6px;
  margin-bottom: 26px;
  overflow: hidden;
  border-radius: 100px;
  background: #9cbdff14;
}

.bar div {
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #397bff, #98ccff);
  box-shadow: 0 0 16px #679fff55;
  transition: width .3s ease;
}

h2 {
  margin: 0 0 24px;
  text-align: right;
  color: #edf4ff;
  font-size: clamp(19px, 4vw, 24px);
  line-height: 1.9;
  font-weight: 700;
}

.option {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  margin: 11px 0;
  padding: 15px;
  border: 1px solid #93b5ef24;
  border-radius: 16px;
  background: #0c1d3680;
  box-shadow: none;
  color: #dce8fb;
  text-align: right;
  line-height: 1.8;
  font-weight: 400;
}

.option b {
  display: grid;
  place-items: center;
  flex: 0 0 36px;
  height: 36px;
  border: 1px solid #8db6ff20;
  border-radius: 11px;
  background: #86aeff0e;
  color: #abcaff;
  font-size: 14px;
}

.option span {
  flex: 1;
}

.option.selected {
  border-color: #80afff;
  background: linear-gradient(120deg, #397cff26, #264c8626);
  box-shadow:
    0 0 0 1px #80afff20,
    inset 0 0 22px #4e89ff08;
  color: #fff;
}

.option.selected b {
  border-color: transparent;
  background: #75a7ff;
  color: #091b39;
}

.actions {
  display: flex;
  gap: 12px;
  margin-top: 28px;
}

.actions button {
  flex: 1;
}

.secondary {
  border: 1px solid #94b9ff30;
  background: #81aaff0d;
  box-shadow: none;
  color: #c5dbff;
}

.score {
  margin: 24px 0;
  color: #8abaff;
  font-size: clamp(64px, 13vw, 88px);
  font-weight: 800;
  text-shadow: 0 0 45px #5a96ff25;
}

small {
  color: #98abc7;
  font-size: 12px;
  line-height: 1.9;
}

#status {
  min-height: 20px;
  margin-top: 18px;
  color: #b1c8e8;
  font-size: 13px;
  line-height: 1.8;
}

.float {
  position: fixed;
  display: grid;
  place-items: center;
  width: 82px;
  height: 82px;
  border: 1px solid #7aabff25;
  border-radius: 24px;
  background: linear-gradient(145deg, #6b9fff15, #2e64b508);
  box-shadow: inset 0 1px 0 #ffffff08, 0 15px 40px #00000015;
  color: #79adff;
  font-size: 34px;
  pointer-events: none;
  animation: float 8s ease-in-out infinite;
}

.a { left: 8%; top: 20%; rotate: -12deg; }
.b { right: 7%; bottom: 20%; animation-delay: -2s; }
.c {
  left: 15%;
  bottom: 12%;
  font-size: 23px;
  animation-delay: -4s;
}
.d {
  right: 12%;
  top: 15%;
  font-size: 23px;
  animation-delay: -3s;
}

@keyframes float {
  50% { translate: 0 -22px; rotate: 6deg; }
}

@keyframes enter {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (hover: hover) {
  button:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 12px 30px #2164e740;
  }

  .option:hover {
    border-color: #8db7ff70;
    background: #24467755;
    box-shadow: none;
  }

  .secondary:hover {
    background: #81aaff1a;
    box-shadow: none;
  }
}

@media (max-width: 800px) {
  body { padding: 28px 17px; }
  .card { padding: 23px 19px; border-radius: 23px; }
  .brand { margin-bottom: 25px; }
  .actions { flex-direction: column; }
  .float {
    width: 48px;
    height: 48px;
    border-radius: 15px;
    font-size: 23px;
    opacity: .45;
  }
  .a { left: 1%; top: 6%; }
  .d { right: 1%; top: 8%; font-size: 16px; }
  .b { right: 1%; bottom: 4%; }
  .c { left: 1%; bottom: 5%; font-size: 16px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
<div aria-hidden="true">
<div class="float a">⚛</div><div class="float b">⚗</div>
<div class="float c">H₂O</div><div class="float d">Na⁺</div>
</div>
<main id="app"></main>
<script>
const qs=[
["ما هي الحالة التي تكون فيها جسيمات المادة متقاربة جداً وتتحرك حركة اهتزازية فقط؟",
["الغازية","السائلة","الصلبة","البلازما"],2],
["المواد الصلبة التي تترتب جسيماتها بنمط هندسي منظم ومكرر تسمى:",
["المواد الصلبة غير البلورية","المواد الصلبة البلورية","السوائل المترابطة","البوليمرات المرنة"],1],
["أي من المواد التالية يعتبر مثالاً على مادة صلبة غير بلورية (زجاجية)؟",
["كلوريد الصوديوم","الألماس","الزجاج والمطاط","الجليد النقي"],2],
["تُعرف مقاومة السائل للتدفق والانسياب بـ:",
["التوتر السطحي","الخاصية الشعرية","اللزوجة","الضغط البخاري"],2],
["كيف تتأثر لزوجة السوائل عادةً عند ارتفاع درجات الحرارة؟",
["تقل اللزوجة ويسهل تدفق السائل","تزيد اللزوجة ويصبح أثقل","تتجمد المادة فوراً","لا تتأثر نهائياً"],0],
["القوى التي تجعل سطح السائل يتقوس أو يتماسك كأنه غشاء رقيق هي:",
["قوى التلاصق","التوتر السطحي","الخاصية الشعرية","قوى التنافر"],1],
["ارتفاع السائل في الأنابيب الضيقة (الخاصية الشعرية) ينتج أساساً عن:",
["انعدام الجاذبية","قوى التلاصق بين جزيئات السائل وجدران الأنبوب","زيادة حجم الإناء","تبخر السائل السريع"],1],
["أي العوامل الآتية تزيد من لزوجة السائل؟",
["ارتفاع درجة الحرارة","خفة وزن الجزيئات","قوى التجاذب الكبيرة بين الجزيئات","تقليل حجم الإناء"],2],
["المواد الصلبة غير البلورية تتكون عادةً عندما:",
["تبرد السوائل ببطء شديد","تبرد السوائل بسرعة دون أن تتيح للجسيمات أن تترتب بانتظام","يتم تسخين المادة إلى درجة الغليان","تتجمد المواد في الفراغ"],1],
["لماذا تحافظ المادة الصلبة على شكلها بينما يأخذ السائل شكل الإناء الذي يوضع فيه؟",
["لأن جزيئات الصلب أخف وزناً بكثير","لأن جزيئات السائل غير مرتبطة بأي قوى","لأن جزيئات الصلب مقيدة في مكانها، بينما جزيئات السائل حرة وقابلة للانزلاق","لأن السوائل لا تحتوي على كتلة"],2]
];
const app=document.getElementById("app");
let player="",i=0,score=0,choice=null,end=0,clock,playing=false;
const letters=["أ","ب","ج","د"];
function home(){
 clearInterval(clock);playing=false;
 app.innerHTML=`
 <div class="brand">⚛ عنصر</div>
 <span class="tag">تحدي حالات المادة وخواصها</span>
 <h1>كل سؤال،<br><span>اكتشاف جديد.</span></h1>
 <p>١٠ أسئلة في عالم الكيمياء.<br>دقيقة لكل سؤال… جاهز للتحدي؟</p>
 <form class="card">
 <label for="name">بأي اسم نحتفل بنتيجتك؟</label>
 <input id="name" required maxlength="40"
 placeholder="اسمك أو اسم المستخدم" autocomplete="nickname">
 <button class="wide">ابدأ التحدي ←</button>
 <p><small>اسم فقط، بدون كلمة مرور</small></p>
 </form>`;
 document.getElementById("name").value=player;
 app.querySelector("form").onsubmit=e=>{
  e.preventDefault();
  const input=document.getElementById("name");
  player=input.value.trim();
  if(!player){input.setCustomValidity("اكتب اسمك أولاً");input.reportValidity();return}
  input.setCustomValidity("");i=0;score=0;question();
 };
 document.getElementById("name").oninput=e=>e.target.setCustomValidity("");
}
function question(){
 clearInterval(clock);choice=null;playing=true;end=Date.now()+60000;
 app.innerHTML=`
 <div class="brand">⚛ عنصر</div>
 <div class="meta"><span>السؤال ${i+1} من ١٠</span>
 <span id="timer" class="timer" role="timer">01:00</span></div>
 <div class="bar"><div style="width:${i*10}%"></div></div>
 <section class="card">
 <h2 id="q" tabindex="-1"></h2>
 <div id="options" role="group" aria-labelledby="q"></div>
 <button id="next" class="wide" style="margin-top:20px" disabled>
 ${i===9?"اعرض نتيجتي":"تأكيد الإجابة والمتابعة"} ←</button>
 <p><small>اختر إجابتك ثم أكّدها قبل انتهاء الوقت.<br>
 عند انتهاء الدقيقة ينتقل السؤال تلقائياً.</small></p>
 </section>`;
 document.getElementById("q").textContent=qs[i][0];
 qs[i][1].forEach((text,n)=>{
  const b=document.createElement("button");
  b.className="option";b.setAttribute("aria-pressed","false");
  const mark=document.createElement("b");mark.textContent=letters[n];
  const label=document.createElement("span");label.textContent=text;
  b.append(mark,label);
  b.onclick=()=>{
   if(Date.now()>=end){next(true);return}
   choice=n;
   document.querySelectorAll(".option").forEach((el,j)=>{
    el.classList.toggle("selected",n===j);
    el.setAttribute("aria-pressed",String(n===j));
   });
   document.getElementById("next").disabled=false;
  };
  document.getElementById("options").append(b);
 });
 document.getElementById("next").onclick=()=>next(Date.now()>=end);
 document.getElementById("q").focus();
 clock=setInterval(tick,150);
}
function tick(){
 if(!playing)return;
 const seconds=Math.max(0,Math.ceil((end-Date.now())/1000));
 const t=document.getElementById("timer");
 t.textContent=String(Math.floor(seconds/60)).padStart(2,"0")+":"+
 String(seconds%60).padStart(2,"0");
 t.classList.toggle("urgent",seconds<=10);
 if(!seconds)next(true);
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)tick()});
function next(timeout){
 if(!playing)return;
 playing=false;clearInterval(clock);
 if(!timeout&&choice===qs[i][2])score++;
 i++;
 i<qs.length?question():result();
}
function result(){
 app.innerHTML=`
 <div class="brand">⚛ عنصر</div>
 <span class="tag">اكتمل التحدي</span>
 <h1>مبروك <span id="player"></span>!</h1>
 <p>أنهيت رحلتك في عالم الكيمياء.</p>
 <section class="card">
 <div style="font-size:45px;color:var(--blue)">✧</div>
 <p>نتيجتك النهائية</p>
 <div class="score">${score}<span style="font-size:25px;color:#91a0b7"> / 10</span></div>
 <p>${score>=8?"معرفة رائعة تستحق الاحتفال!":"كل محاولة تزيد معرفتك. واصل الاكتشاف!"}</p>
 <small>الإجابة غير المؤكدة عند انتهاء الوقت تُحسب بلا إجابة.</small>
 <div class="actions">
 <button class="secondary" id="retry">↻ أعد التحدي</button>
 <button id="share">↗ شارك النتيجة</button>
 </div><div id="status" role="status"></div>
 </section>`;
 document.getElementById("player").textContent=player;
 document.getElementById("retry").onclick=home;
 document.getElementById("share").onclick=share;
}
async function share(){
 const button=document.getElementById("share");
 const status=document.getElementById("status");
 button.disabled=true;
 try{
  const c=document.createElement("canvas");c.width=1200;c.height=900;
  const x=c.getContext("2d");
  x.fillStyle="#edf3ff";x.fillRect(0,0,1200,900);
  x.fillStyle="#fff";x.fillRect(65,65,1070,770);
  x.textAlign="center";x.direction="rtl";
  x.fillStyle="#2864ed";x.font="bold 46px Tahoma";
  x.fillText("عنصر | تحدي الكيمياء",600,180);
  x.fillStyle="#183153";x.font="bold 45px Tahoma";
  x.fillText("مبروك!",600,290);
  let size=65;
  do{
   x.font="bold "+size+"px Tahoma";
   if(x.measureText(player).width<940)break;
   size-=2;
  }while(size>15);
  x.fillText(player,600,395);
  x.fillStyle="#2864ed";x.direction="ltr";
  x.font="bold 150px Tahoma";x.fillText(score+" / 10",600,600);
  x.direction="rtl";x.fillStyle="#74839a";
  x.font="30px Tahoma";x.fillText("حالات المادة وخواصها",600,710);
  x.font="23px Tahoma";x.fillText("فضولك هو البداية",600,780);
  const blob=await new Promise(resolve=>c.toBlob(resolve,"image/png"));
  if(!blob)throw Error("image");
  const file=new File([blob],"chemistry-result.png",{type:"image/png"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
   await navigator.share({files:[file],title:"نتيجتي في تحدي الكيمياء"});
   status.textContent="تمت مشاركة بطاقة النتيجة";
  }else{
   const url=URL.createObjectURL(blob);
   const a=document.createElement("a");
   a.href=url;a.download="chemistry-result.png";a.click();
   setTimeout(()=>URL.revokeObjectURL(url),60000);
   status.textContent="تم تنزيل صورة النتيجة، جاهزة للمشاركة";
  }
 }catch(e){
  status.textContent=e.name==="AbortError"?"تم إلغاء المشاركة":
  "تعذرت المشاركة. حاول مرة أخرى.";
 }finally{button.disabled=false}
}
home();
</script>
</html>
